services:
  mariadb:
    image: mariadb:11.4
    container_name: stock-analyzer-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: stock_analyzer
      MARIADB_USER: stock_analyzer
      MARIADB_PASSWORD: stock_analyzer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - stock_analyzer_mariadb_data:/var/lib/mysql

volumes:
  stock_analyzer_mariadb_data:
